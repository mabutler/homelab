# Cap the journal at 1 GiB. Left alone, journald sizes itself at 10% of the
# filesystem, which on the 50 GiB root would let logs quietly grow to 5 GiB.
#
# A drop-in rather than an edit to journald.conf, so a pacman update to that
# file never conflicts and pacdiff has nothing to report.
[Journal]
SystemMaxUse=1G
