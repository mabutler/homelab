# Compressed swap in RAM. On a 7.7 GiB box running containers, this is the
# difference between a memory spike being absorbed and the OOM killer picking
# a victim — and unlike disk swap it costs no SSD writes and no seek latency.
#
# zram-size is in megabytes. 4096 gives roughly 4 GiB of swap that will hold
# perhaps 10-12 GiB of typical pages after zstd compression.
[zram0]
zram-size = 4096
compression-algorithm = zstd
