# Swap aggressively. The usual advice to keep swappiness low assumes swap is a
# slow disk; here it is compressed RAM, so moving cold pages into it is nearly
# free and buys back memory for page cache and containers.
vm.swappiness = 100

# Readahead is pointless for zram. The default of 3 (2^3 = 8 pages) fetches
# neighbouring pages on every fault, which pays off on a spinning disk and is
# pure wasted decompression on a device with no seek penalty.
vm.page-cluster = 0
