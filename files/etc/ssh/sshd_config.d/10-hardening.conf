# Keys only. Nothing else gets you a shell over sshd.
#
# Tailscale SSH is the independent second door and does not read this file, so
# a mistake here does not have to mean a keyboard and a monitor — but only once
# Tailscale is up, which is bootstrap/30-access.sh. Until then this file is the
# only way in, which is why 03-chroot.sh runs `sshd -t` before it lets you
# reboot.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes

X11Forwarding no
AllowAgentForwarding no
PrintMotd no
