# State directories for the Phase 3c applications.
#
# All on /opt/appdata (ext4), all small, all SQLite. Created here rather than
# left to podman, which refuses to create a bind-mount source and would fail
# the unit at start.
#
# Safe in tmpfiles.d — unlike Immich's library, none of these are on the pool,
# so there is no window where an early boot could create them on the wrong disk.
# Ownership is per-app and NOT cosmetic — it is whichever uid the image runs
# as. Root-owned directories under a container that dropped privileges give a
# service that starts, logs something benign, and then cannot write.
#
# Mealie honours PUID/PGID, so 1000 here matches mealie.env.
d /opt/appdata/mealie          0750 1000 1000 -

# Vikunja runs as uid 1000 and does NOT support PUID/PGID — the only way to
# change it is podman's --user, so the directories are owned to match instead.
# Upstream's own walkthrough says to chown before first start.
d /opt/appdata/vikunja         0750 1000 1000 -
d /opt/appdata/vikunja/db      0750 1000 1000 -
d /opt/appdata/vikunja/files   0750 1000 1000 -

# Memos runs as root in its container.
d /opt/appdata/memos           0750 root root -
