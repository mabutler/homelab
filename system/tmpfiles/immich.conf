# Immich state directories.
#
# NOTE WHAT IS *NOT* HERE: /opt/appdata/immich/postgres.
#
# The Postgres entrypoint chowns its data directory to the postgres user on
# first start and expects to own it forever. A tmpfiles `d` line re-applies its
# mode and ownership on EVERY `systemd-tmpfiles --create` — at boot, and every
# time deploy.sh touches a tmpfiles file. So a root-owned line here silently
# takes the data directory back from Postgres after it was working.
#
# The failure is nasty: the running postmaster keeps serving from file
# descriptors it already holds, so Immich looks healthy, while every NEW
# backend dies with
#
#   FATAL: could not open file "global/pg_filenode.map": Permission denied
#
# which is what a backup discovers at 02:30, weeks later.
#
# The database directory is created by an ExecStartPre in
# immich-database.container instead — mkdir only, never chown.
d /opt/appdata/immich            0750 root root -
d /opt/appdata/immich/model-cache 0750 root root -
