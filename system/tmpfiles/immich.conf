# Immich state directories, created before the containers start.
#
# Without these, podman creates the paths itself as root with whatever mode it
# felt like — and, worse, would create /mnt/pool/photos on the ROOT filesystem
# if the pool were not mounted. RequiresMountsFor in the units is the guard
# against that; this file just makes the layout explicit and owned.
d /opt/appdata/immich            0750 root root -
d /opt/appdata/immich/postgres   0700 root root -
d /opt/appdata/immich/model-cache 0750 root root -
