# Application state directories, created before any container starts.
#
# Type Path                          Mode UID  GID  Age Argument
d /opt/appdata                       0755 root root -
d /opt/appdata/vaultwarden           0700 root root -

# Secrets. 0700 so only root can even list what exists here.
d /etc/homelab                       0700 root root -
d /etc/homelab/apps                  0700 root root -
