---
# Healthchecks catalog deployment and zero-touch API reconciliation

- name: Deploy canonical checks catalog JSON
  ansible.builtin.template:
    src: "checks-catalog.json.j2"
    dest: "{{ monitoring_catalog_file }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Reconcile checks catalog with Healthchecks.io API
  ansible.builtin.command:
    cmd: "/usr/local/bin/homelab-hc-reconcile --catalog {{ monitoring_catalog_file }}"
  changed_when: true

- name: Ensure checks.json exists with secure permissions
  ansible.builtin.file:
    path: "{{ monitoring_checks_file }}"
    state: file
    owner: "root"
    group: "root"
    mode: "0600"

- name: Register monitoring paths in backup inclusion manifest
  ansible.builtin.lineinfile:
    path: "/etc/homelab/backup-include.txt"
    line: "{{ item }}"
    state: present
  loop:
    - "/etc/homelab"
    - "{{ monitoring_checks_file }}"
  when: true
