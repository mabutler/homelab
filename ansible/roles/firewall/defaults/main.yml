---
# Defaults for firewall role

firewall_enabled: true
firewall_table_name: "filter"
firewall_address_family: "inet"
firewall_allowed_subnets:
  - "192.168.4.0/24"
firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443
firewall_allowed_udp_ports:
  - 41641
firewall_allowed_interfaces:
  - "lo"
  - "tailscale0"

# Frigate NVR LAN-accessible ports
firewall_frigate_tcp_ports:
  - 5000
  - 8971
  - 8554
  - 8555
firewall_frigate_udp_ports:
  - 8555
