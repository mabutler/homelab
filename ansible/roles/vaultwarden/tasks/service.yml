---
# Systemd service unit management for vaultwarden

- name: Deploy Vaultwarden systemd service unit
  ansible.builtin.template:
    src: vaultwarden.service.j2
    dest: /etc/systemd/system/vaultwarden.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  register: vaultwarden_unit_file

- name: Force systemd daemon reload if unit file changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: vaultwarden_unit_file.changed

- name: Enable and start Vaultwarden service
  ansible.builtin.systemd:
    name: vaultwarden
    state: started
    enabled: true
