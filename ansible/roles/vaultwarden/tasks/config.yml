---
# Configuration tasks for vaultwarden

- name: Deploy Vaultwarden environment configuration file (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vaultwarden_service_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart vaultwarden

- name: Deploy Vaultwarden Docker Compose manifest
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vaultwarden_service_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vaultwarden
