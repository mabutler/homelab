---
# Configuration deployment for Immich Photo Management Platform

- name: Deploy Immich .env configuration with restricted permissions (0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_service_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart immich

- name: Deploy Immich .env.example template
  ansible.builtin.copy:
    src: env.example
    dest: "{{ immich_service_dir }}/.env.example"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Immich docker compose manifest
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ immich_service_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart immich
