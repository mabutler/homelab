---
# Configuration deployment for Media & Arr Stack (Stage 1)

- name: Deploy Media & Arr .env configuration with restricted permissions (0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ arr_service_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart arr stack

- name: Deploy Media & Arr .env.example template
  ansible.builtin.copy:
    src: env.example
    dest: "{{ arr_service_dir }}/.env.example"
    owner: root
    group: root
    mode: "0644"

- name: Deploy arr_vpn kernel netfilter kill-switch script
  ansible.builtin.template:
    src: killswitch.sh.j2
    dest: "{{ arr_service_dir }}/vpn/killswitch.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart arr stack

- name: Deploy arr_vpn exit-node healthcheck script
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ arr_service_dir }}/vpn/healthcheck.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart arr stack

- name: Deploy Media & Arr docker compose manifest
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ arr_service_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart arr stack
