---
# Configuration deployment tasks for Frigate NVR

- name: Deploy Frigate secrets environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ frigate_app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart frigate

- name: Deploy Frigate sanitized example environment file
  ansible.builtin.copy:
    src: env.example
    dest: "{{ frigate_app_dir }}/.env.example"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Frigate configuration file
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ frigate_config_dir }}/config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart frigate

- name: Deploy Frigate Docker Compose manifest
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ frigate_app_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart frigate
