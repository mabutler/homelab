---
# Systemd service unit management for Frigate NVR

- name: Deploy Frigate systemd service unit
  ansible.builtin.template:
    src: frigate.service.j2
    dest: /etc/systemd/system/frigate.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  register: frigate_unit_file

- name: Force systemd daemon reload if unit file changed
  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: frigate_unit_file.changed

- name: Enable and start Frigate service
  ansible.builtin.systemd:
    name: frigate
    state: started
    enabled: true
