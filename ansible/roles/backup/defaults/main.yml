---
# Defaults for backup role

backup_config_dir: "/etc/homelab"
backup_hook_dir: "/etc/homelab/backup.d"
backup_runner_path: "/usr/local/bin/homelab-backup"

# 4 Bootstrap credentials / repository targets
backup_b2_account_id: "{{ vault_b2_account_id | default('') }}"
backup_b2_account_key: "{{ vault_b2_account_key | default('') }}"
backup_restic_repository: "{{ vault_restic_repository | default('') }}"
backup_restic_password: "{{ vault_restic_password | default('') }}"

# Inclusions and exclusions
backup_include_paths:
  - "/etc/homelab"
  - "/etc/homelab/vault.yml"
  - "/etc/homelab/apps"
  - "/etc/homelab/monitoring.env"
  - "/etc/homelab/monitoring/checks-catalog.json"
  - "/opt/services"
  - "/var/lib/homelab/monitoring/checks.json"
  - "/home/admin/projects"
  - "/mnt/storage/media/photos/library"

backup_exclude_patterns:
  - "/opt/services/*/data/*.sqlite3"
  - "/opt/services/*/data/*.db"
  - "/opt/services/*/config/*.db"
  - "*.sqlite3-wal"
  - "*.sqlite3-shm"
  - "*.db-wal"
  - "*.db-shm"
  - "*.sock"
  - "*.log"
  - "*.tmp"
  - "/opt/services/*/backups/vaultwarden-backup-*.tar.gz"
  - "/opt/services/frigate/config/model_cache"
  - "/opt/services/immich/data/postgres/**"
  - "/opt/services/immich/data/thumbs/**"
  - "/opt/services/immich/data/model-cache/**"
  - "/mnt/storage/media/photos/upload/**"
  - "/mnt/storage/media/photos/encoded-video/**"
  - "/mnt/scratch"
  - "/mnt/scratch/**"
  - "node_modules"
  - ".venv"
  - "venv"
  - "__pycache__"
  - "*.pyc"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".ruff_cache"
  - ".tox"


# Retention policy
backup_keep_daily: 7
backup_keep_weekly: 5
backup_keep_monthly: 12

# Systemd timer schedules
backup_timer_on_calendar: "*-*-* 02:30:00"
backup_timer_randomized_delay_sec: 300
backup_check_timer_on_calendar: "Sun *-*-* 04:00:00"
backup_check_data_subset: "5%"
