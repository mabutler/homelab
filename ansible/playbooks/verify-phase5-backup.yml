---
- name: Homelab2 Centralized Backblaze B2 Backup Acceptance Verification
  hosts: homelab_nodes
  become: true
  gather_facts: false

  tasks:
    - name: "BK-001: Assert restic binary is installed and operational"
      ansible.builtin.command:
        cmd: restic version
      changed_when: false

    - name: "BK-002: Assert /etc/homelab/backup.env permissions (0600 root:root)"
      ansible.builtin.stat:
        path: /etc/homelab/backup.env
      register: bk02_env
      failed_when: >
        (not bk02_env.stat.exists) or
        (bk02_env.stat.mode != "0600") or
        (bk02_env.stat.pw_name != "root") or
        (bk02_env.stat.gr_name != "root")

    - name: "BK-003: Assert B2 cloud repository connectivity"
      ansible.builtin.shell:
        cmd: |
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          restic -r "$RESTIC_REPOSITORY" snapshots --json
      changed_when: false

    - name: "BK-004: Assert /etc/homelab/vault.yml is included in latest snapshot"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          restic -r "$RESTIC_REPOSITORY" ls latest | grep -E '(^|/)etc/homelab/vault\.yml'
      changed_when: false

    - name: "BK-005: Assert live db.sqlite3 is excluded from latest snapshot"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          ! restic -r "$RESTIC_REPOSITORY" ls latest | grep -E 'db\.sqlite3$'
      changed_when: false

    - name: "BK-006: Assert pre-backup hook and snapshot integrity check passes"
      ansible.builtin.command:
        cmd: /usr/local/bin/homelab-backup run --dry-run
      changed_when: false

    - name: "BK-007: Assert homelab-backup and integrity check timers are active"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      check_mode: true
      loop:
        - homelab-backup.timer
        - homelab-backup-check.timer
      register: bk07_timers
      failed_when: bk07_timers.status.ActiveState != "active"

    - name: "BK-008: Assert non-destructive restore viability and vault.yml checksum match"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          TARGET="/tmp/b2-test-restore"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          RESTORE_SCRIPT=""
          for s in ./scripts/restore-from-b2.sh /tmp/restore-from-b2.sh /usr/local/bin/restore-from-b2.sh \
                   /tmp/homelab2-ansible/scripts/restore-from-b2.sh /opt/homelab2/scripts/restore-from-b2.sh; do
            if [ -x "$s" ]; then
              RESTORE_SCRIPT="$s"
              break
            fi
          done

          if [ -z "$RESTORE_SCRIPT" ]; then
            echo "restore-from-b2.sh not found" >&2
            exit 1
          fi

          "$RESTORE_SCRIPT" --target-dir "$TARGET" --include-path etc/homelab/vault.yml --force

          ORIG_SUM=$(sha256sum /etc/homelab/vault.yml | awk '{print $1}')
          REST_SUM=$(sha256sum "$TARGET/etc/homelab/vault.yml" | awk '{print $1}')
          rm -rf "$TARGET"
          [ -n "$ORIG_SUM" ] && [ "$ORIG_SUM" = "$REST_SUM" ]
      changed_when: false

    - name: "BK-009: Assert Stage 1 dry-run includes vault.yml and excludes /mnt/storage"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          RESTORE_SCRIPT=""
          for s in ./scripts/restore-from-b2.sh /tmp/restore-from-b2.sh /usr/local/bin/restore-from-b2.sh \
                   /tmp/homelab2-ansible/scripts/restore-from-b2.sh /opt/homelab2/scripts/restore-from-b2.sh; do
            if [ -x "$s" ]; then
              RESTORE_SCRIPT="$s"
              break
            fi
          done
          if [ -z "$RESTORE_SCRIPT" ]; then
            echo "restore-from-b2.sh not found" >&2
            exit 1
          fi
          OUT=$("$RESTORE_SCRIPT" --stage config --dry-run 2>&1)
          echo "$OUT" | grep -F "etc/homelab/vault.yml" >/dev/null
          ! echo "$OUT" | grep -E '(^|/)mnt/storage' >/dev/null
      changed_when: false

    - name: "BK-010: Assert Stage 2 restore against unmounted target fails closed with CRITICAL"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          TARGET="/tmp/b2-unmounted-test"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          RESTORE_SCRIPT=""
          for s in ./scripts/restore-from-b2.sh /tmp/restore-from-b2.sh /usr/local/bin/restore-from-b2.sh \
                   /tmp/homelab2-ansible/scripts/restore-from-b2.sh /opt/homelab2/scripts/restore-from-b2.sh; do
            if [ -x "$s" ]; then
              RESTORE_SCRIPT="$s"
              break
            fi
          done
          if [ -z "$RESTORE_SCRIPT" ]; then
            echo "restore-from-b2.sh not found" >&2
            rm -rf "$TARGET"
            exit 1
          fi
          rc=0
          ERR_OUT=$("$RESTORE_SCRIPT" --stage data --target-dir "$TARGET" --force 2>&1) || rc=$?
          rm -rf "$TARGET"
          [ "$rc" -eq 1 ] && echo "$ERR_OUT" | grep -q "CRITICAL: Storage mountpoint"
      changed_when: false

    - name: "BK-011: Assert invalid stage argument rejection exits with code 1"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          RESTORE_SCRIPT=""
          for s in ./scripts/restore-from-b2.sh /tmp/restore-from-b2.sh /usr/local/bin/restore-from-b2.sh \
                   /tmp/homelab2-ansible/scripts/restore-from-b2.sh /opt/homelab2/scripts/restore-from-b2.sh; do
            if [ -x "$s" ]; then
              RESTORE_SCRIPT="$s"
              break
            fi
          done
          if [ -z "$RESTORE_SCRIPT" ]; then
            echo "restore-from-b2.sh not found" >&2
            exit 1
          fi
          rc=0
          "$RESTORE_SCRIPT" --stage invalid --dry-run >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 1 ]
      changed_when: false

    - name: "BK-012: Assert Stage 1 restore rehearsal restores vault.yml with mode 0600 and no /mnt/storage"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /etc/homelab/backup.env
          set +a
          TARGET="/tmp/b2-stage1-test"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          RESTORE_SCRIPT=""
          for s in ./scripts/restore-from-b2.sh /tmp/restore-from-b2.sh /usr/local/bin/restore-from-b2.sh \
                   /tmp/homelab2-ansible/scripts/restore-from-b2.sh /opt/homelab2/scripts/restore-from-b2.sh; do
            if [ -x "$s" ]; then
              RESTORE_SCRIPT="$s"
              break
            fi
          done
          if [ -z "$RESTORE_SCRIPT" ]; then
            echo "restore-from-b2.sh not found" >&2
            rm -rf "$TARGET"
            exit 1
          fi
          OUT=$("$RESTORE_SCRIPT" --stage 1 --target-dir "$TARGET" --include-path etc/homelab/vault.yml --force 2>&1)
          MODE=$(stat -c "%a" "$TARGET/etc/homelab/vault.yml" 2>/dev/null || echo "")
          if [ "$MODE" != "600" ]; then
            rm -rf "$TARGET"
            exit 1
          fi
          if [ -e "$TARGET/mnt/storage" ]; then
            rm -rf "$TARGET"
            exit 1
          fi
          if echo "$OUT" | grep -i "post-restore hooks" >/dev/null; then
            rm -rf "$TARGET"
            exit 1
          fi
          rm -rf "$TARGET"
      changed_when: false

    - name: Display Phase 5 Backup verification summary
      ansible.builtin.debug:
        msg:
          - "=== Phase 5 Backup & Disaster Recovery Verification Summary ==="
          - "BK-001 Restic Installed: PASS"
          - "BK-002 Env Permissions: PASS"
          - "BK-003 B2 Connectivity: PASS"
          - "BK-004 Secret Included: PASS"
          - "BK-005 Live DB Excluded: PASS"
          - "BK-006 Dry-Run & Pre-Hook: PASS"
          - "BK-007 Timers Active: PASS"
          - "BK-008 Restore Viability: PASS"
          - "BK-009 Stage 1 Dry-Run Filter: PASS"
          - "BK-010 Stage 2 Unmounted Guard: PASS"
          - "BK-011 Invalid Stage Rejection: PASS"
          - "BK-012 Stage 1 Rehearsal: PASS"
