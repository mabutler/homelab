---
- name: Homelab2 Core Hardening & IaC Orchestration
  hosts: homelab_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify vault.yml exists on controller
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/group_vars/all/vault.yml"
      register: vault_stat
      delegate_to: localhost
      run_once: true
      tags:
        - always

    - name: Abort if vault.yml is missing
      ansible.builtin.fail:
        msg: >
          CRITICAL ERROR: '{{ inventory_dir }}/group_vars/all/vault.yml' not found.
          Copy 'vault.yml.example' to 'vault.yml' and configure required secrets before running.
      when: not vault_stat.stat.exists
      delegate_to: localhost
      run_once: true
      tags:
        - always

  roles:
    - role: common_packages
      tags:
        - common
        - packages

    - role: admin_user
      tags:
        - security
        - admin
        - sudo

    - role: ssh_hardening
      tags:
        - security
        - ssh

    - role: time_sync
      tags:
        - diagnostics
        - time

    - role: disk_health
      tags:
        - diagnostics
        - disk

    - role: system_safeguards
      tags:
        - diagnostics
        - safeguards
        - oomd
        - journald

    - role: udev_rules
      tags:
        - udev
        - hardware

    - role: tailscale
      tags:
        - network
        - tailscale
        - vpn

    - role: firewall
      tags:
        - network
        - firewall
        - nftables

    - role: caddy
      tags:
        - network
        - ingress
        - caddy
        - proxy

    - role: storage_layout
      tags:
        - storage
        - storage_layout

    - role: mergerfs
      tags:
        - storage
        - mergerfs
        - pool

    - role: snapraid
      tags:
        - storage
        - snapraid
        - parity

    - role: docker
      tags:
        - docker
        - containers

    - role: vaultwarden
      tags:
        - vaultwarden
        - app

    - role: frigate
      tags:
        - frigate
        - app

    - role: immich
      tags:
        - immich
        - app

    - role: backup
      tags:
        - backup
        - restic

    - role: antigravity
      tags:
        - antigravity
        - remote_control
        - agent

    - role: monitoring
      tags:
        - monitoring
        - ntfy
        - healthchecks
