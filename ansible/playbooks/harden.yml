---
- name: Homelab2 Standalone Hardening & Remote Access Playbook
  hosts: homelab_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify vault.yml exists on controller
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/group_vars/all/vault.yml"
      register: vault_stat
      delegate_to: localhost
      run_once: true
      tags:
        - always

    - name: Abort if vault.yml is missing
      ansible.builtin.fail:
        msg: >
          CRITICAL ERROR: '{{ inventory_dir }}/group_vars/all/vault.yml' not found.
          Copy 'vault.yml.example' to 'vault.yml' and configure required secrets before running.
      when: not vault_stat.stat.exists
      delegate_to: localhost
      run_once: true
      tags:
        - always

  roles:
    - role: admin_user
      tags:
        - security
        - admin
        - sudo

    - role: ssh_hardening
      tags:
        - security
        - ssh
