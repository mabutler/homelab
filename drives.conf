# drives.conf — the drive table for fidelacchius.
#
# This file is read by the scripts, not kept as documentation, so it cannot
# drift from reality. Every destructive or verifying operation resolves a
# serial to a device through /dev/disk/by-id/ata-*_<serial>. No script in this
# repository accepts a /dev/sdX path: this machine has a SATA add-on card and
# an external drive tower, and device letters shuffle between boots.
#
# Serials captured 2026-08-27 from the live ISO
# (lsblk -d -o PATH,SIZE,ROTA,MODEL,SERIAL). Sizes are as lsblk renders them,
# so a human comparing this table to lsblk output sees the same strings.
#
# Roles: exactly one ssd, exactly one parity, one or more data.
# Parity must be at least as large as the largest data drive.  2T >= 2T. OK.
#
# The label column means two different things, by role:
#
#   parity/data — a PRECONDITION. These drives are unpartitioned ext4, so the
#                 label is on the whole disk and `lsblk -dno LABEL <dev>`
#                 returns it. bootstrap/40-storage.sh verifies the label found
#                 on each drive matches this table, and refuses to proceed on
#                 a mismatch rather than formatting or relabelling anything.
#
#   ssd         — an OUTPUT. `archroot` is the label install/01-partition.sh
#                 applies to p2 when it creates it; the whole disk carries no
#                 filesystem and no label, so a whole-disk label check on this
#                 row reads empty and must not be performed.
#
# Parity assignment (a judgement call, made once):
#   All three ST2000DM006 drives were bought and run together — 60,825 /
#   60,827 / 60,829 power-on hours, a four-hour spread across seven years, so
#   "most worn" does not discriminate. The tiebreaker used is the only
#   media-side difference between them: Z4Z971E6 reports Reported_Uncorrect=1
#   where the other two report 0. Parity is the drive whose loss costs least,
#   because parity is recomputable from the data drives, so the drive with the
#   one blemish holds it.
#
#   Deliberately NOT parity: Z4Z972VW. SnapRAID writes parity on every sync
#   and only reads data drives on scrub, which makes parity the write-heaviest
#   member of the array — the last place you want a drive whose SATA link is
#   in question. See docs/smart-baseline-2026-08-27.md.
#
# serial            label      role    size
154593406196        archroot   ssd     111.8G
Z4Z971E6            PARITY1    parity  1.8T
Z4Z972VW            DISK1      data    1.8T
Z4Z9739G            DISK2      data    1.8T
WD-WCC4MLEVP674     DISK3      data    931.5G
