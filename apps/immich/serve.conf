# apps/immich/serve.conf — how Immich is reachable.
#
# Tailnet only. There is no version of this that goes on the public internet:
# it is every photo you have, and unlike Vaultwarden the contents are not
# encrypted at rest in a way that survives the server being compromised.

SERVE_TARGET=http://127.0.0.1:2283
SERVE_PATH=/

# NOT 443 (Vaultwarden's, and funnelled), and deliberately not 8443 or 10000
# either — those are the only other ports Tailscale will Funnel, so parking
# Immich outside that set means no future mistake can publish it.
SERVE_PORT=8444

FUNNEL=no
