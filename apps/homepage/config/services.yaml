# The dashboard. Edited in the repository, not in a UI — `git pull` on the
# server is how the page changes, and a rebuilt host comes back with its
# services already on it.
#
# `container:` + `server: podman` is what draws the running/stopped dot. It
# reads through the socket proxy, which can see container state and nothing
# else.
#
# HREFS ARE THE TAILNET NAME AND PORT, not localhost: these links are followed
# by your browser, on your laptop, which has no 127.0.0.1:8222.

- Essential:
    - Vaultwarden:
        icon: bitwarden.png
        href: https://fidelacchius.fable-mackarel.ts.net
        description: passwords — the only public service
        server: podman
        container: vaultwarden
    - Immich:
        icon: immich.png
