# apps/vaultwarden/serve.conf — how this app is reachable.
#
# Read by deploy.sh (via lib/publish.sh) and converged on every deploy, because
# `tailscale serve` state lives in tailscaled and does not survive a rebuild.
# This file is the declaration; the machine is made to match it.

# Vaultwarden binds 127.0.0.1 only. This is what makes it reachable at all.
SERVE_TARGET=http://127.0.0.1:8222
SERVE_PATH=/

# The one deliberate exception to "nothing is public, ever": a password manager
# you cannot reach from a work PC that will not join your tailnet is not a
# usable password manager.
#
# Funnel is per PORT, not per path. Anything else ever mounted on 443 becomes
# public with it — so 443 stays exclusively Vaultwarden, and any other app that
# wants `tailscale serve` gets a different port.
FUNNEL=yes

# Vetoes the public door while the vault is in a state where opening it would
# be a mistake. Never blocks the tailnet mount above.
FUNNEL_GUARD=funnel-guard.sh
